name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Runner
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            sw_vers
            lsappinfo info -only name "$(lsappinfo front)" || true
            defaults read com.apple.HIToolbox AppleEnabledInputSources || true
          else
            cmd //c ver
            reg query 'HKLM\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' //v pv || echo "no WebView2 runtime (machine-wide)"
          fi
          uname -m
          rustc --version
      - name: WebView2 diagnosis (temporary, #112)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          cargo build -q -p pokit-fixture --target-dir target/fixture
          $exe = "target\fixture\debug\pokit-fixture.exe"
          function Try-Launch($name) {
            $d = Join-Path $env:RUNNER_TEMP "wv2-$name"
            $env:WEBVIEW2_USER_DATA_FOLDER = $d
            $p = Start-Process $exe -PassThru
            Start-Sleep 30
            $port = Get-ChildItem -Recurse $d -Filter DevToolsActivePort -ErrorAction SilentlyContinue | Select-Object -First 1
            $cmd = (Get-CimInstance Win32_Process -Filter "name='msedgewebview2.exe'" | Where-Object { $_.CommandLine -match '--embedded-browser-webview=1' -and $_.CommandLine -match [regex]::Escape($d) } | Select-Object -First 1).CommandLine
            "== ${name}: alive=$(-not $p.HasExited) port=$(if ($port) { (Get-Content $port.FullName)[0] } else { 'none' }) debugging-arg=$($cmd -match 'remote-debugging-port')"
            Stop-Process $p -ErrorAction SilentlyContinue
            Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -ErrorAction SilentlyContinue
            Start-Sleep 3
          }
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=0"
          Try-Launch "env"
          Remove-Item Env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS
          $k = "HKCU:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments"
          New-Item -Path $k -Force | Out-Null
          New-ItemProperty -Path $k -Name "pokit-fixture.exe" -Value "--remote-debugging-port=0" -Force | Out-Null
          Try-Launch "policy"
          Remove-Item -Path "HKCU:\Software\Policies\Microsoft\Edge\WebView2" -Recurse -Force
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=9333"
          Try-Launch "env-fixed-port"
          Remove-Item Env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS
      - run: cargo fmt --all -- --check
        if: ${{ !cancelled() }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
        if: ${{ !cancelled() }}
      - run: cargo test --workspace --no-fail-fast
        if: ${{ !cancelled() }}
