name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Runner
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            sw_vers
            lsappinfo info -only name "$(lsappinfo front)" || true
            defaults read com.apple.HIToolbox AppleEnabledInputSources || true
          else
            cmd //c ver
            reg query 'HKLM\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' //v pv || echo "no WebView2 runtime (machine-wide)"
          fi
          uname -m
          rustc --version
      - run: cargo fmt --all -- --check
        if: ${{ !cancelled() }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
        if: ${{ !cancelled() }}
      - run: cargo test --workspace --no-fail-fast
        if: ${{ !cancelled() }}
      - name: WebView2 diagnosis (temporary, #112)
        if: ${{ runner.os == 'Windows' && !cancelled() }}
        shell: pwsh
        run: |
          "interactive: " + [Environment]::UserInteractive
          whoami
          query session
          "session: " + (Get-Process -Id $PID).SessionId
          $d = Join-Path $env:RUNNER_TEMP wv2
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=0"
          $env:WEBVIEW2_USER_DATA_FOLDER = $d
          $p = Start-Process target\fixture\debug\pokit-fixture.exe -PassThru
          Start-Sleep 45
          "alive: " + (-not $p.HasExited)
          if ($p.HasExited) { "exit: " + $p.ExitCode }
          Get-CimInstance Win32_Process -Filter "name='msedgewebview2.exe'" | Select-Object -First 2 -ExpandProperty CommandLine
          foreach ($k in 'HKLM:\SOFTWARE\Policies\Microsoft\Edge', 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2', 'HKCU:\SOFTWARE\Policies\Microsoft\Edge', 'HKCU:\SOFTWARE\Policies\Microsoft\Edge\WebView2') {
            if (Test-Path $k) { "== $k"; Get-ItemProperty $k | Format-List; Get-ChildItem $k | ForEach-Object { "-- " + $_.Name; Get-ItemProperty $_.PSPath | Format-List } } else { "(no $k)" }
          }
          Get-ChildItem -Recurse $d -Filter DevToolsActivePort -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName; Get-Content $_.FullName }
          Get-ChildItem $d -ErrorAction SilentlyContinue | Select-Object -First 20 Name
          Get-WinEvent -LogName Application -MaxEvents 30 -ErrorAction SilentlyContinue | Where-Object { $_.Message -match 'pokit-fixture|msedgewebview2' } | Select-Object -First 5 TimeCreated, Id, Message | Format-List
          Stop-Process $p -ErrorAction SilentlyContinue
