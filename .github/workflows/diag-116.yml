name: diag-116

on:
  push:
    branches: [ci-current-webview2]

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build the fixture
        run: cargo build -q -p pokit-fixture --target-dir target/fixture
      - name: WebView2 runtime (current Evergreen)
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/?linkid=2124701' -OutFile $exe
          $p = Start-Process $exe -ArgumentList '/silent', '/install' -Wait -PassThru
          "installer exit code: $($p.ExitCode)"
      - name: Probe elevated
        shell: pwsh
        run: ./.github/diag-116.ps1 -Label elevated
      - name: Probe with the app at Medium
        shell: pwsh
        run: |
          ./.github/medium-probe.ps1 -Exe target/fixture/debug/pokit-fixture.exe -Out "$env:RUNNER_TEMP\medium.txt"
          Get-Content "$env:RUNNER_TEMP\medium.txt"
