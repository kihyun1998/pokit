[package]
name = "pokit"
version = "0.1.0"
edition = "2021"
description = "Feeds real input into a running webview desktop app and reports what the page did."
repository = "https://github.com/kihyun1998/pokit"
readme = "../../README.md"
publish = false

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "process"] }
tokio-tungstenite = "0.24"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_Graphics_Dwm", "Win32_Storage_Xps"] }
png = "0.17"

[target.'cfg(windows)'.dev-dependencies]
png = "0.17"
