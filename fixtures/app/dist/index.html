<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>pokit fixture</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 16px; }
    section { border: 1px solid #ccc; padding: 8px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>pokit fixture</h1>

  <section id="pane-form">
    <h2>Form</h2>
    <label for="name">Name</label>
    <input id="name" type="text">
    <label for="password">Password</label>
    <input id="password" type="password">
    <button id="submit" type="button">Submit</button>
    <p id="result" role="status"></p>
  </section>

  <section id="pane-other">
    <h2>Other</h2>
    <label for="other-input">Other input</label>
    <input id="other-input" type="text">
  </section>

  <section id="pane-events">
    <h2>Events</h2>
    <button id="target" type="button">Event target</button>
    <p id="last-mouse" role="status"></p>
    <p id="last-key" role="status"></p>
  </section>

  <section id="pane-measure">
    <h2>Measure</h2>
    <label for="stall">Stall field</label>
    <input id="stall" type="text">
    <p id="key-count" data-count="0"></p>
  </section>

  <section id="pane-clipboard">
    <h2>Clipboard</h2>
    <label for="clip">Clipboard field</label>
    <input id="clip" type="text">
    <label for="ime">IME field</label>
    <input id="ime" type="text">
  </section>

  <section id="pane-scroll">
    <h2>Scroll</h2>
    <div id="scroller" style="height: 150px; overflow: auto; border: 1px solid #ccc">
      <div style="height: 3000px">Scroll me</div>
    </div>
  </section>

  <section id="pane-native">
    <h2>Native</h2>
    <p id="native-result" role="status"></p>
    <button id="pick-file" type="button">Pick a file</button>
    <div id="context-target" style="padding: 8px; border: 1px dashed #999">Right-click me</div>
  </section>

  <section id="pane-drag">
    <h2>Drag</h2>
    <div id="drag-me" style="width: 120px; height: 40px; background: #cde; touch-action: none; user-select: none">Drag me</div>
    <p id="drag-result" role="status"></p>
  </section>

  <section id="pane-actions">
    <h2>Actions</h2>
    <button id="show-later" type="button">Show later</button>
    <button id="show-now" type="button">Show now</button>
    <button id="open-second" type="button">Open second window</button>
    <button id="throw" type="button">Throw</button>
    <button id="backend-log" type="button">Backend log</button>
    <div id="late-slot"></div>
  </section>

  <script>
    const $ = (id) => document.getElementById(id);

    // Every keyboard, input and focus event, in order, for reading back what the page received.
    window.__events = [];
    const describe = (t) => (t === window ? 'window' : t.id || t.nodeName);
    for (const type of ['keydown', 'keyup', 'input', 'focusin', 'focusout',
                        'compositionstart', 'compositionupdate', 'compositionend']) {
      document.addEventListener(type, (e) => window.__events.push([Math.round(performance.now()), type, describe(e.target), e.key ?? e.data ?? '']), true);
    }
    for (const type of ['focus', 'blur']) {
      window.addEventListener(type, (e) => { if (e.target === window) window.__events.push([Math.round(performance.now()), type, 'window', '']); });
    }
    const invoke = (cmd, args) => window.__TAURI__.core.invoke(cmd, args);

    // The form echoes what was submitted, password included.
    $('submit').addEventListener('click', () => {
      const name = $('name').value;
      const password = $('password').value;
      $('result').textContent = `Hello, ${name}`;
      console.log(`submit name=${name} password=${password}`);
    });

    // Each mouse event on the target is written out by type.
    for (const type of ['click', 'dblclick', 'contextmenu', 'mouseover']) {
      $('target').addEventListener(type, (e) => {
        if (type === 'contextmenu') e.preventDefault();
        $('last-mouse').textContent = type;
      });
    }

    // Every keydown is written out as modifiers plus the physical key.
    window.addEventListener('keydown', (e) => {
      const mods = [e.ctrlKey && 'Ctrl', e.altKey && 'Alt', e.shiftKey && 'Shift', e.metaKey && 'Meta'].filter(Boolean);
      $('last-key').textContent = [...mods, e.code].join('+');
    }, true);

    // The late element appears 1500 ms after the button is pressed.
    $('show-later').addEventListener('click', () => {
      setTimeout(() => {
        const p = document.createElement('p');
        p.id = 'late';
        p.textContent = 'Arrived';
        $('late-slot').appendChild(p);
      }, 1500);
    });

    // The on-demand element appears as soon as its button is pressed.
    $('show-now').addEventListener('click', () => {
      const p = document.createElement('p');
      p.id = 'on-demand';
      p.textContent = 'Here';
      $('late-slot').appendChild(p);
    });

    // A drag of #drag-me with the pointer captured: dropped in the page it says where, dropped
    // outside the window it opens a window there.
    let dragging = null;
    let moves = 0;
    $('drag-me').addEventListener('pointerdown', (e) => {
      dragging = e.pointerId;
      moves = 0;
      $('drag-me').setPointerCapture(e.pointerId);
      $('drag-result').textContent = 'dragging';
    });
    $('drag-me').addEventListener('pointermove', (e) => { if (e.pointerId === dragging) moves += 1; });
    $('drag-me').addEventListener('pointerup', (e) => {
      if (e.pointerId !== dragging) return;
      dragging = null;
      $('drag-result').dataset.moves = moves;
      if (e.clientX < 0 || e.clientY < 0 || e.clientX >= innerWidth || e.clientY >= innerHeight) {
        $('drag-result').textContent = `out at ${e.screenX},${e.screenY}`;
        invoke('open_dropped', { x: e.screenX, y: e.screenY });
      } else {
        $('drag-result').textContent = `in at ${Math.round(e.clientX)},${Math.round(e.clientY)}`;
      }
    });
    $('pick-file').addEventListener('click', () => invoke('pick_file'));
    // A right-click on #context-target pops up the app's native context menu instead of the
    // webview's own.
    $('context-target').addEventListener('contextmenu', (e) => {
      e.preventDefault();
      invoke('show_context_menu');
    });
    // Every wheel turn over the scroller, with its delta.
    $('scroller').addEventListener('wheel', (e) => window.__events.push([Math.round(performance.now()), 'wheel', 'scroller', String(e.deltaY)]));

    // Every keydown in the stall field blocks the page for `window.__stallMs` (0 until a test sets it),
    // then bumps the key count's `data-count` once.
    window.__stallMs = 0;
    function stallOnKey() {
      const end = performance.now() + window.__stallMs;
      while (performance.now() < end) {}
      const count = $('key-count');
      count.dataset.count = String(Number(count.dataset.count) + 1);
    }
    $('stall').addEventListener('keydown', stallOnKey);

    $('open-second').addEventListener('click', () => invoke('open_second'));
    $('throw').addEventListener('click', () => setTimeout(() => { throw new Error('fixture boom'); }));
    $('backend-log').addEventListener('click', () => invoke('backend_log', { line: 'hello' }));
  </script>
</body>
</html>
