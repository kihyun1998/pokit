[package]
name = "pokit-fixture"
version = "0.0.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# The test build: pokit's plugin, and a launch that leaves the frontmost app in front.
pokit = ["dep:tauri-plugin-pokit"]

[dependencies]
tauri = { version = "2", features = ["custom-protocol", "tray-icon"] }
tauri-plugin-pokit = { path = "../../crates/tauri-plugin-pokit", optional = true }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
